# Reviewed public coursework network evidence workflow.
# Run evidence is generated by GitHub Actions; the YAML alone is not evidence.
# Evidence machine is an ephemeral GitHub-hosted Ubuntu runner, not the user's Mac.
name: Coursework public website evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/coursework-network-evidence.yml]

permissions:
  contents: read

concurrency:
  group: coursework-network-evidence
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_HOST: wityu666.github.io
      SITE_PATH: /csi205tc-personal-webpage/
      SITE_REPOSITORY: wityu666/csi205tc-personal-webpage
    steps:
      - name: Install public network analysis tools before capture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tcpdump tshark dnsutils traceroute iputils-ping
          mkdir -p evidence
          python3 --version > evidence/tool_versions.txt
          tshark --version >> evidence/tool_versions.txt
          tcpdump --version >> evidence/tool_versions.txt 2>&1
          google-chrome --version >> evidence/tool_versions.txt

      - name: Capture only public coursework requests and record three rounds
        shell: bash
        run: |
          set -euo pipefail
          cat > capture_public_site.py <<'PY'
          import csv
          import datetime
          import hashlib
          import html
          import http.client
          import io
          import ipaddress
          import json
          import os
          import pathlib
          import platform
          import signal
          import socket
          import ssl
          import struct
          import subprocess
          import time
          import urllib.request

          out = pathlib.Path('evidence')
          host = os.environ['SITE_HOST']
          path = os.environ['SITE_PATH']
          repo = os.environ['SITE_REPOSITORY']
          resources = ('index.html', 'styles.css', 'script.js')
          if (host, path, repo) != ('wityu666.github.io', '/csi205tc-personal-webpage/', 'wityu666/csi205tc-personal-webpage'):
              raise ValueError('This probe is restricted to the public coursework website')
          url = 'https://' + host + path
          now = lambda: datetime.datetime.now(datetime.timezone.utc).isoformat()
          sha = os.environ['GITHUB_SHA']
          direct = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          expected = {}
          for name in resources:
              source = f'https://raw.githubusercontent.com/{repo}/{sha}/{name}'
              with direct.open(source, timeout=30) as response:
                  body = response.read(2_000_000)
              if not body:
                  raise ValueError('Empty deployed source: ' + name)
              expected[name] = body
              (out / ('expected_' + name)).write_bytes(body)
          for attempt in range(30):
              try:
                  for name in resources:
                      target = url if name == 'index.html' else url + name
                      with direct.open(target, timeout=15) as response:
                          assert response.status == 200
                          assert response.url == target
                          assert response.read(2_000_000) == expected[name]
                  break
              except (OSError, AssertionError) as error:
                  print(f'Pages preflight attempt {attempt + 1}: {error}', flush=True)
                  if attempt == 29:
                      raise
                  time.sleep(10)
          addresses = sorted({x[4][0] for x in socket.getaddrinfo(host, 443, socket.AF_INET, socket.SOCK_STREAM)})
          if not addresses or any(not ipaddress.ip_address(a).is_global for a in addresses):
              raise ValueError('Expected globally routable GitHub Pages IPv4 addresses')
          selected_ip = addresses[0]
          resolvers = [line.split()[1] for line in pathlib.Path('/etc/resolv.conf').read_text().splitlines() if line.strip().startswith('nameserver ')]
          resolver = next((a for a in resolvers if ':' not in a), '1.1.1.1')
          context = ssl.create_default_context()
          context.keylog_filename = str((out / 'website_tls_session_keys.log').resolve())
          context.set_alpn_protocols(['http/1.1'])

          class PublicConnection(http.client.HTTPSConnection):
              def __init__(self, source_port):
                  super().__init__(host, port=443, timeout=20, context=context)
                  self.source_port = source_port
              def connect(self):
                  raw = socket.create_connection((selected_ip, 443), timeout=20, source_address=('0.0.0.0', self.source_port))
                  self.sock = context.wrap_socket(raw, server_hostname=host)

          def execute(command, timeout=35):
              started = now()
              try:
                  result = subprocess.run(command, text=True, capture_output=True, timeout=timeout)
                  return dict(command=command, started_utc=started, returncode=result.returncode, stdout=result.stdout, stderr=result.stderr)
              except (OSError, subprocess.TimeoutExpired) as error:
                  return dict(command=command, started_utc=started, error=str(error))

          def dns_query(round_index):
              identifier = 2050 + round_index
              labels = b''.join(bytes([len(p)]) + p.encode('ascii') for p in host.split('.')) + b'\0'
              packet = struct.pack('!HHHHHH', identifier, 0x0100, 1, 0, 0, 0) + labels + struct.pack('!HH', 1, 1)
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                  sock.settimeout(5)
                  sock.bind(('0.0.0.0', 49301))
                  began = time.monotonic_ns()
                  sock.sendto(packet, (resolver, 53))
                  reply, sender = sock.recvfrom(65535)
                  elapsed = (time.monotonic_ns() - began) / 1e6
              fields = struct.unpack_from('!HHHHHH', reply)
              if fields[0] != identifier or not fields[1] & 0x8000 or fields[1] & 15:
                  raise ValueError('DNS reply ID/QR/RCODE check failed')
              return dict(question=host, server=resolver, transaction_id=identifier, response_source=list(sender), answer_count=fields[3], elapsed_ms=elapsed, request_hex=packet.hex(), response_hex=reply.hex())

          # Fixed client ports isolate this script from runner control/API/credential traffic.
          hosts = ' or '.join('host ' + a for a in addresses)
          capture_filter = f'(udp port 49301 and host {resolver}) or (tcp port 443 and tcp portrange 49310-49318 and ({hosts})) or (icmp and ({hosts}))'
          metadata = dict(evidence_machine='GitHub-hosted ephemeral Ubuntu 24.04 runner; not the local macOS computer', platform=platform.platform(), started_utc=now(), repository=repo, source_commit=sha, workflow_run_id=os.environ['GITHUB_RUN_ID'], workflow_run_attempt=os.environ['GITHUB_RUN_ATTEMPT'], workflow_url=f'https://github.com/{repo}/actions/runs/' + os.environ['GITHUB_RUN_ID'], url=url, resolved_ipv4=addresses, selected_https_peer=selected_ip, dns_resolver=resolver, capture_filter=capture_filter, scope='Only public coursework HTTPS requests, isolated hostname DNS transactions, and ICMP to resolved website addresses. TLS keys belong only to these public requests. ICMP loss and incomplete routes must be reported as observed.')
          (out / 'provenance.json').write_text(json.dumps(metadata, indent=2) + '\n')
          capture_log = (out / 'tcpdump.log').open('w')
          capture = subprocess.Popen(['sudo', '-n', 'tcpdump', '-i', 'any', '-U', '-s', '0', '-w', str(out / 'website.pcap'), capture_filter], stdout=capture_log, stderr=subprocess.STDOUT)
          rounds = []
          try:
              for _ in range(50):
                  time.sleep(.1)
                  if capture.poll() is not None:
                      raise RuntimeError('tcpdump stopped before capture')
                  if (out / 'website.pcap').exists():
                      break
              else:
                  raise RuntimeError('tcpdump did not create the capture file')
              time.sleep(.5)
              for round_index in range(3):
                  record = dict(round=round_index + 1, started_utc=now(), requests=[])
                  try:
                      record['dns_probe'] = dns_query(round_index)
                  except (OSError, ValueError, struct.error) as error:
                      record['dns_probe'] = dict(error=str(error))
                  record['nslookup'] = execute(['nslookup', host], 15)
                  record['ping'] = execute(['ping', '-c', '5', '-W', '2', host], 20)
                  record['traceroute'] = execute(['traceroute', '-n', '-m', '12', '-q', '1', '-w', '1', host], 20)
                  for index, name in enumerate(resources):
                      source_port = 49310 + round_index * 3 + index
                      connection = PublicConnection(source_port)
                      entry = dict(resource=name, source_port=source_port, url=url if name == 'index.html' else url + name)
                      try:
                          began = time.monotonic_ns()
                          connection.connect()
                          entry.update(tls_version=connection.sock.version(), cipher=connection.sock.cipher(), local_endpoint=connection.sock.getsockname(), peer_endpoint=connection.sock.getpeername())
                          connection.request('GET', path if name == 'index.html' else path + name, headers={'User-Agent': 'CSI205TC-public-coursework-evidence/1.0', 'Connection': 'close', 'Accept-Encoding': 'identity'})
                          response = connection.getresponse()
                          body = response.read(2_000_000)
                          entry.update(http_status=response.status, http_reason=response.reason, headers=dict(response.getheaders()), received_bytes=len(body), sha256=hashlib.sha256(body).hexdigest(), matches_deployed_commit_source=body == expected[name], elapsed_ms=(time.monotonic_ns() - began) / 1e6)
                          (out / f'round{round_index + 1}_{name}').write_bytes(body)
                      except (OSError, http.client.HTTPException) as error:
                          entry['error'] = str(error)
                      finally:
                          connection.close()
                      record['requests'].append(entry)
                      time.sleep(.2)
                  rounds.append(record)
                  (out / 'website_probe.json').write_text(json.dumps(dict(provenance=metadata, rounds=rounds), indent=2) + '\n')
                  time.sleep(.5)
          finally:
              # Stop only the exact capture process/children started by this script.
              subprocess.run(['sudo', '-n', 'pkill', '-INT', '-P', str(capture.pid)], check=False)
              if capture.poll() is None:
                  subprocess.run(['sudo', '-n', 'kill', '-INT', str(capture.pid)], check=False)
              try:
                  capture.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  capture.kill()
                  capture.wait(timeout=5)
              capture_log.close()
              subprocess.run(['sudo', '-n', 'chown', str(os.getuid()) + ':' + str(os.getgid()), str(out / 'website.pcap')], check=False)
          base = ['tshark', '-n', '-2', '-r', str(out / 'website.pcap'), '-o', 'tls.keylog_file:' + str(out / 'website_tls_session_keys.log')]
          fields = ['frame.number', 'frame.time_relative', 'ip.src', 'ip.dst', 'tcp.stream', 'tcp.srcport', 'tcp.dstport', 'tcp.flags', 'tcp.seq', 'tcp.ack', 'tcp.len', 'dns.id', 'dns.flags.response', 'dns.qry.name', 'dns.a', 'http.request.method', 'http.request.uri', 'http.response.code', 'tls.handshake.type', 'tls.handshake.extensions_server_name', '_ws.col.Protocol', '_ws.col.Info']
          command = base + ['-T', 'fields', '-E', 'header=y', '-E', 'separator=,', '-E', 'quote=d'] + sum((['-e', value] for value in fields), [])
          packets_csv = subprocess.run(command, capture_output=True, text=True, check=True).stdout
          (out / 'wireshark_website_packets.csv').write_text(packets_csv)
          rows = list(csv.DictReader(io.StringIO(packets_csv)))
          # Virtual column headers vary across supported TShark versions.
          for row in rows:
              row['_ws.col.Protocol'] = row.get('_ws.col.Protocol', row.get('Protocol', ''))
              row['_ws.col.Info'] = row.get('_ws.col.Info', row.get('Info', ''))
          def count(expression):
              text = subprocess.run(base + ['-Y', expression, '-T', 'fields', '-e', 'frame.number'], capture_output=True, text=True, check=True).stdout
              return len(text.splitlines())
          summary = dict(packet_count=len(rows), tcp_streams=len({r['tcp.stream'] for r in rows if r['tcp.stream']}), initial_syn=count('tcp.flags.syn == 1 && tcp.flags.ack == 0'), syn_ack=count('tcp.flags.syn == 1 && tcp.flags.ack == 1'), fin_packets=count('tcp.flags.fin == 1'), retransmissions=count('tcp.analysis.retransmission || tcp.analysis.fast_retransmission'), client_hello=count('tls.handshake.type == 1'), server_hello=count('tls.handshake.type == 2'), decrypted_gets=count('http.request.method == GET'), http_200=count('http.response.code == 200'), dns_queries=count('dns.flags.response == 0 && dns.qry.name == "wityu666.github.io"'), dns_responses=count('dns.flags.response == 1 && dns.qry.name == "wityu666.github.io"'), icmp_packets=count('icmp'), dns_answer_ipv4=sorted({r['dns.a'] for r in rows if r['dns.a']}), sni_names=sorted({r['tls.handshake.extensions_server_name'] for r in rows if r['tls.handshake.extensions_server_name']}))
          checks = dict(three_complete_rounds=len(rounds) == 3 and all(len(r['requests']) == 3 for r in rounds), nine_exact_public_source_matches=len(rounds) == 3 and all(q.get('http_status') == 200 and q.get('matches_deployed_commit_source') for r in rounds for q in r['requests']), nine_tcp_tls_http_sessions=summary['tcp_streams'] == summary['initial_syn'] == summary['syn_ack'] == summary['client_hello'] == summary['server_hello'] == summary['decrypted_gets'] == summary['http_200'] == 9, three_successful_isolated_dns_exchanges=summary['dns_queries'] == summary['dns_responses'] == 3 and all(r['dns_probe'].get('answer_count', 0) > 0 for r in rounds), expected_sni_only=summary['sni_names'] == [host])
          summary.update(verification_checks=checks, status='PASS' if all(checks.values()) else 'REVIEW_REQUIRED', finished_utc=now())
          (out / 'wireshark_website_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          hierarchy = subprocess.run(base + ['-q', '-z', 'io,phs'], capture_output=True, text=True, check=True).stdout
          (out / 'wireshark_protocol_hierarchy.txt').write_text(hierarchy)
          (out / 'network_transcript.txt').write_text(json.dumps(dict(provenance=metadata, rounds=rounds, summary=summary), indent=2) + '\n')
          visible = [r for r in rows if r['dns.qry.name'] or r['http.request.method'] or r['http.response.code'] or r['tls.handshake.type'] or r['tcp.flags'] in ('0x0002', '0x0012')][:45]
          header = '<tr>' + ''.join('<th>' + html.escape(f) + '</th>' for f in ('frame.number', 'frame.time_relative', 'ip.src', 'ip.dst', '_ws.col.Protocol', '_ws.col.Info')) + '</tr>'
          table = ''.join('<tr>' + ''.join('<td>' + html.escape(r[f]) + '</td>' for f in ('frame.number', 'frame.time_relative', 'ip.src', 'ip.dst', '_ws.col.Protocol', '_ws.col.Info')) + '</tr>' for r in visible)
          evidence_html = '<!doctype html><meta charset="utf-8"><title>Genuine Q2 remote runner evidence</title><style>body{font:16px Arial;margin:35px;color:#18273c}pre{white-space:pre-wrap;font:13px monospace;background:#edf1f7;padding:15px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #bbc;padding:5px;text-align:left}</style><h1>Q2 genuine remote network evidence</h1><p>Test machine: GitHub-hosted Ubuntu 24.04 runner. This is a TShark-derived evidence view, not the Wireshark GUI and not the local Mac.</p><pre>' + html.escape(json.dumps(metadata, indent=2)) + '</pre><h2>Independent verification summary</h2><pre>' + html.escape(json.dumps(summary, indent=2)) + '</pre><h2>Selected captured packets</h2><table>' + header + table + '</table>'
          (out / 'network_evidence.html').write_text(evidence_html)
          manifest = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file()}
          (out / 'sha256_manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps(summary, indent=2), flush=True)
          if not all(checks.values()):
              raise SystemExit(1)
          PY
          python3 capture_public_site.py

      - name: Save genuine live webpage and evidence screenshots after capture
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --user-data-dir="$RUNNER_TEMP/cw-browser-desktop" --window-size=1440,1100 --virtual-time-budget=5000 --screenshot="$PWD/evidence/live_desktop.png" "https://$SITE_HOST$SITE_PATH"
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --user-data-dir="$RUNNER_TEMP/cw-browser-mobile" --window-size=390,844 --virtual-time-budget=5000 --screenshot="$PWD/evidence/live_mobile.png" "https://$SITE_HOST$SITE_PATH"
          if test -f evidence/network_evidence.html; then
            google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --user-data-dir="$RUNNER_TEMP/cw-browser-evidence" --window-size=1600,2400 --virtual-time-budget=1000 --screenshot="$PWD/evidence/network_evidence.png" "file://$PWD/evidence/network_evidence.html"
          fi
          python3 - <<'PY'
          import hashlib,json,pathlib
          out=pathlib.Path('evidence')
          manifest={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file() and p.name!='sha256_manifest.json'}
          (out/'sha256_manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY

      - name: Upload genuine coursework evidence and diagnostics
        if: always()
        # actions/upload-artifact v7.0.2, official release commit verified 2026-10-17.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coursework-public-network-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
